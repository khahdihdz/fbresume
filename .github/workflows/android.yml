name: Android Build

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK to FBResume.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FBResume.apk
          test -s app/build/outputs/apk/debug/FBResume.apk
          ls -lh app/build/outputs/apk/debug/FBResume.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBResume-${{ github.run_number }}
          path: app/build/outputs/apk/debug/FBResume.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/FBResume.apk \
            --title "FBResume $TAG" \
            --generate-notes
