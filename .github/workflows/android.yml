name: Android Build & Signed APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Khóa ký dùng chung do repo khahdihdz/apksign quản lý và đồng bộ tự động
      # qua workflow sync-android-signing (4 secret ANDROID_SIGNING_*).
      # Fallback về FBRESUME_* để build không gãy nếu secret chưa được đồng bộ.
      KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 || secrets.FBRESUME_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD || secrets.FBRESUME_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS || secrets.FBRESUME_KEY_ALIAS || 'khahdihdz-release' }}
      KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD || secrets.FBRESUME_KEY_PASSWORD }}
      APKSIGN_SYNCED: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Set CI version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          n = os.environ["GITHUB_RUN_NUMBER"]
          s = re.sub(r"versionCode = \d+", f"versionCode = {n}", s)
          s = re.sub(r'versionName = "[^"]*"', f'versionName = "1.1.{n}"', s)
          p.write_text(s)
          PY
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Prepare and validate signing key from khahdihdz/apksign
        run: |
          set -euo pipefail

          if [ "$APKSIGN_SYNCED" = "true" ]; then
            echo "Signing key source: khahdihdz/apksign (synced ANDROID_SIGNING_* secrets)"
          else
            echo "Signing key source: repository FBRESUME_* secrets (fallback — ANDROID_SIGNING_* not synced yet)"
          fi

          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing signing secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Khahdihdz/apksign syncs ANDROID_SIGNING_* secrets daily; also check repository secrets."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/fbresume-source.jks"
          NORMALIZED_KEYSTORE="$RUNNER_TEMP/fbresume-signing.p12"

          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"; then
            echo "::error::Signing keystore secret is not valid Base64."
            exit 1
          fi
          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded file is not a valid keystore or the store password is incorrect."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Alias '$KEY_ALIAS' was not found in the signing keystore."
            exit 1
          fi

          # Chuẩn hóa theo workflow android-shared-signing của khahdihdz/apksign:
          # thử JKS/PKCS12 và cả KEY_PASSWORD lẫn STORE_PASSWORD cho private key,
          # xuất PKCS12 dùng store password cho cả key để Gradle ký ổn định.
          imported=false
          for source_type in JKS PKCS12; do
            for source_key_password in "$KEY_PASSWORD" "$KEYSTORE_PASSWORD"; do
              rm -f "$NORMALIZED_KEYSTORE"
              if keytool -importkeystore \
                -srckeystore "$KEYSTORE_FILE" \
                -srcstoretype "$source_type" \
                -srcstorepass "$KEYSTORE_PASSWORD" \
                -srcalias "$KEY_ALIAS" \
                -srckeypass "$source_key_password" \
                -destkeystore "$NORMALIZED_KEYSTORE" \
                -deststoretype PKCS12 \
                -deststorepass "$KEYSTORE_PASSWORD" \
                -destalias "$KEY_ALIAS" \
                -destkeypass "$KEYSTORE_PASSWORD" \
                -noprompt >/dev/null 2>&1 \
                && keytool -list -keystore "$NORMALIZED_KEYSTORE" -storetype PKCS12 \
                   -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                imported=true
                break 2
              fi
            done
          done

          if [ "$imported" != true ]; then
            echo "::error::Không đọc được private key của alias '$KEY_ALIAS' với KEY_PASSWORD hoặc store password."
            exit 1
          fi
          chmod 600 "$NORMALIZED_KEYSTORE"

          echo "Signing configuration validated successfully."
          echo "Keystore: valid (normalized PKCS12)"
          echo "Alias: configured"

      - name: Build signed debug APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/fbresume-signing.p12
        run: |
          set -euo pipefail
          gradle assembleDebug --stacktrace \
            -PFBRESUME_KEYSTORE_FILE="$KEYSTORE_FILE" \
            -PFBRESUME_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PFBRESUME_KEY_ALIAS="$KEY_ALIAS" \
            -PFBRESUME_KEY_PASSWORD="$KEYSTORE_PASSWORD"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/fbresume-signing.p12
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace \
            -PFBRESUME_KEYSTORE_FILE="$KEYSTORE_FILE" \
            -PFBRESUME_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PFBRESUME_KEY_ALIAS="$KEY_ALIAS" \
            -PFBRESUME_KEY_PASSWORD="$KEYSTORE_PASSWORD"

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "${APKSIGNER:-}" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare signed APK files
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FBResume-debug-signed.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FBResume-release-signed.apk
          ls -lh app/build/outputs/apk/debug/FBResume-debug-signed.apk app/build/outputs/apk/release/FBResume-release-signed.apk

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FBResume-signed-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/FBResume-debug-signed.apk
            app/build/outputs/apk/release/FBResume-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/FBResume-release-signed.apk \
            app/build/outputs/apk/debug/FBResume-debug-signed.apk \
            --title "FBResume $TAG" \
            --generate-notes

      - name: Keep only 5 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t OLD_RELEASES < <(
            gh release list --limit 100 --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[5:][] | .tagName'
          )

          for tag in "${OLD_RELEASES[@]}"; do
            [ -z "$tag" ] && continue
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes
          done

      - name: Cleanup signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fbresume-source.jks" "$RUNNER_TEMP/fbresume-signing.p12"
