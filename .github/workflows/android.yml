name: Android Build & Signed APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Set CI version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          n = os.environ["GITHUB_RUN_NUMBER"]
          s = s.replace("versionCode = 2", f"versionCode = {n}")
          s = s.replace('versionName = "1.0.1"', f'versionName = "1.0.{n}"')
          p.write_text(s)
          PY
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Prepare and validate signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.FBRESUME_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FBRESUME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FBRESUME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FBRESUME_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing signing secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Check Settings > Secrets and variables > Actions for repository khahdihdz/fbresume."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/fbresume-release.jks"

          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"; then
            echo "::error::FBRESUME_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded file is not a valid keystore or FBRESUME_KEYSTORE_PASSWORD is incorrect."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::FBRESUME_KEY_ALIAS was not found in the keystore."
            exit 1
          fi

          echo "Signing configuration validated successfully."
          echo "Keystore: valid"
          echo "Alias: configured"

      - name: Build signed debug APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/fbresume-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.FBRESUME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FBRESUME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FBRESUME_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleDebug --stacktrace \
            -PFBRESUME_KEYSTORE_FILE="$KEYSTORE_FILE" \
            -PFBRESUME_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PFBRESUME_KEY_ALIAS="$KEY_ALIAS" \
            -PFBRESUME_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/fbresume-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.FBRESUME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FBRESUME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FBRESUME_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace \
            -PFBRESUME_KEYSTORE_FILE="$KEYSTORE_FILE" \
            -PFBRESUME_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PFBRESUME_KEY_ALIAS="$KEY_ALIAS" \
            -PFBRESUME_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "${APKSIGNER:-}" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare signed APK files
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FBResume-debug-signed.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FBResume-release-signed.apk
          ls -lh app/build/outputs/apk/debug/FBResume-debug-signed.apk app/build/outputs/apk/release/FBResume-release-signed.apk

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FBResume-signed-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/FBResume-debug-signed.apk
            app/build/outputs/apk/release/FBResume-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/FBResume-release-signed.apk \
            app/build/outputs/apk/debug/FBResume-debug-signed.apk \
            --title "FBResume $TAG" \
            --generate-notes

      - name: Keep only 5 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t OLD_RELEASES < <(
            gh release list --limit 100 --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[5:][] | .tagName'
          )

          for tag in "${OLD_RELEASES[@]}"; do
            [ -z "$tag" ] && continue
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes
          done

      - name: Cleanup signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fbresume-release.jks"
